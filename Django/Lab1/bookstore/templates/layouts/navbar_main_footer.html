<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}Bookstore{% endblock %}</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg: #f8f5ef;
			--surface: #fffdf8;
			--surface-alt: #efe6d8;
			--text: #1f252b;
			--muted: #5e6670;
			--primary: #0e7a6a;
			--primary-dark: #0a5d51;
			--accent: #de8f32;
			--border: #d8cfbf;
			--shadow: 0 14px 34px rgba(23, 33, 46, 0.12);
			--radius-lg: 20px;
			--radius-md: 14px;
			--radius-sm: 10px;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: 'Outfit', sans-serif;
			color: var(--text);
			background:
				radial-gradient(circle at 15% -15%, rgba(222, 143, 50, 0.24), transparent 42%),
				radial-gradient(circle at 90% 5%, rgba(14, 122, 106, 0.2), transparent 38%),
				var(--bg);
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		.container {
			width: min(1180px, 92vw);
			margin: 0 auto;
		}

		.site-header {
			position: sticky;
			top: 0;
			z-index: 1000;
			backdrop-filter: blur(10px);
			background: rgba(248, 245, 239, 0.86);
			border-bottom: 1px solid rgba(216, 207, 191, 0.8);
		}

		.header-inner {
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-height: 72px;
			gap: 14px;
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font-family: 'Playfair Display', serif;
			font-size: 1.5rem;
			font-weight: 700;
			letter-spacing: 0.4px;
		}

		.brand-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: linear-gradient(160deg, var(--accent), var(--primary));
			box-shadow: 0 0 0 6px rgba(222, 143, 50, 0.12);
		}

		.main-nav {
			display: flex;
			align-items: center;
			gap: 8px;
			flex-wrap: wrap;
			justify-content: flex-end;
		}

		.main-nav a {
			padding: 10px 14px;
			border-radius: 999px;
			color: var(--muted);
			font-weight: 500;
			transition: 0.24s ease;
		}

		.main-nav a:hover {
			color: var(--text);
			background: rgba(14, 122, 106, 0.1);
			transform: translateY(-1px);
		}

		.main-nav .cta-link {
			background: var(--primary);
			color: #ffffff;
		}

		.main-nav .cta-link:hover {
			background: var(--primary-dark);
			color: #ffffff;
		}

		main {
			width: 100%;
			flex: 1;
			padding: 30px 0 44px;
			animation: page-rise 420ms ease;
		}

		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			box-shadow: var(--shadow);
		}

		.site-footer {
			border-top: 1px solid rgba(216, 207, 191, 0.9);
			background: rgba(255, 253, 248, 0.9);
		}

		.footer-inner {
			min-height: 76px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			color: var(--muted);
			font-size: 0.94rem;
		}

		.footer-links {
			display: inline-flex;
			gap: 14px;
			flex-wrap: wrap;
		}

		.footer-links a:hover {
			color: var(--text);
		}

		@keyframes page-rise {
			from {
				opacity: 0;
				transform: translateY(6px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 860px) {
			.header-inner,
			.footer-inner {
				min-height: unset;
				padding: 16px 0;
				flex-direction: column;
				align-items: flex-start;
			}

			.main-nav {
				justify-content: flex-start;
			}
		}
	</style>
	{% block extra_head %}{% endblock %}
</head>
<body>
	<header class="site-header">
		<div class="container header-inner">
			<a href="/" class="brand">
				<span class="brand-dot"></span>
				BookHaven
			</a>

			<nav class="main-nav">
				<a href="{% url 'books.index' %}">Books</a>
				<a href="{% url 'authors.index' %}">Authors</a>
				<a href="{% url 'aboutus.index' %}">About</a>
				<a href="{% url 'contactus.index' %}" class="cta-link">Contact</a>
			</nav>
		</div>
	</header>

	<main>
		<div class="container">
			{% block content %}{% endblock %}
		</div>
	</main>

	<footer class="site-footer">
		<div class="container footer-inner">
			<p>Copyright {% now "Y" %} BookHaven. Curated pages for readers who value design and discovery.</p>
			<div class="footer-links">
				<a href="{% url 'books.index' %}">Browse Books</a>
				<a href="{% url 'authors.index' %}">Meet Authors</a>
				<a href="{% url 'aboutus.index' %}">Our Story</a>
			</div>
		</div>
	</footer>

	{% block extra_scripts %}{% endblock %}
</body>
</html>
