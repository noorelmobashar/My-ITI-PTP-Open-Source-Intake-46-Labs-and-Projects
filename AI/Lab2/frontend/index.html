<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="canvas" aria-hidden="true">
      <div class="grid-glow"></div>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand-lockup">
            <div class="brand-mark">P</div>
            <div>
              <p class="sidebar-label">Workspace</p>
              <h1>Pulse Chat</h1>
            </div>
          </div>
          <button class="icon-button only-mobile" id="sidebarCloseButton" aria-label="Close sidebar">
            &#10005;
          </button>
        </div>

        <button class="new-chat-button" id="newChatButton">+ New chat</button>

        <div class="sidebar-label section-label">Chats</div>
        <div class="chat-list" id="chatList" aria-label="Chat history"></div>

        <footer class="sidebar-footer">
          <p>Switch models per chat. Voice works when an audio model is selected.</p>
        </footer>
      </aside>

      <main class="chat-shell">
        <header class="chat-header">
          <div class="header-left">
            <button class="icon-button only-mobile" id="sidebarOpenButton" aria-label="Open sidebar">
              &#9776;
            </button>
            <div class="title-block">
              <h2 id="activeChatTitle">New chat</h2>
              <p id="activeChatMeta">Pick a model and start chatting.</p>
            </div>
          </div>

          <div class="header-actions">
            <span class="capability-badge" id="modelCapabilityBadge">Text only</span>

            <label class="model-picker" for="modelSelect">
              <span>Model</span>
              <select id="modelSelect" aria-label="Model picker"></select>
            </label>

            <button class="ghost-button" id="deleteChatButton">Delete</button>
          </div>
        </header>

        <section class="messages" id="messages" aria-live="polite" aria-label="Messages"></section>

        <footer class="composer">
          <div class="composer-toolbar">
            <input type="file" id="imageInput" accept="image/*" hidden />
            <button type="button" class="tool-button" id="attachImageButton">
              <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span class="toolbar-label">Photo</span>
            </button>
            <button type="button" class="tool-button voice-reply-toggle" id="voiceReplyButton" aria-label="Toggle voice reply">
              <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              <span class="toolbar-label" id="voiceReplyLabel">Voice reply</span>
            </button>
            <span class="audio-status" id="audioStatus">Choose an audio model to use voice.</span>
          </div>

          <div class="attachment-preview hidden" id="attachmentPreview"></div>

          <div class="composer-shell">
            <textarea
              id="messageInput"
              rows="1"
              maxlength="12000"
              placeholder="Message Pulse Chat"
            ></textarea>
            <button id="recordButton" class="composer-action-button" aria-label="Record voice message">
              <svg class="action-icon mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              <svg class="action-icon stop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
            <button id="sendButton" class="composer-action-button send-active">
              <svg class="action-icon send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>

          <div class="composer-meta">
            <span id="streamStatus">Ready</span>
            <span>Enter to send, Shift+Enter for a new line</span>
          </div>
        </footer>
      </main>
    </div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js" defer></script>
  </body>
</html>
