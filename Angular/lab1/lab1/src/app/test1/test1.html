<div class="max-w-2xl mx-auto my-8 p-6 bg-white dark:bg-zinc-900 rounded-2xl shadow-lg border border-zinc-100 dark:border-zinc-800">
  <h2 class="text-xl font-bold text-zinc-950 dark:text-white mb-6">Students List</h2>
  
  <div class="overflow-hidden border border-zinc-200 dark:border-zinc-800 rounded-xl">
    <table class="min-w-full divide-y divide-zinc-200 dark:divide-zinc-800">
      <thead class="bg-zinc-50 dark:bg-zinc-800/50">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">ID</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Name</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Age</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-zinc-200 dark:divide-zinc-800 bg-white dark:bg-zinc-900">
        <tr *ngFor="let student of students" class="hover:bg-zinc-50 dark:hover:bg-zinc-800/30 transition-colors">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-zinc-900 dark:text-white">{{student.id}}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-zinc-600 dark:text-zinc-300">{{student.name}}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-zinc-600 dark:text-zinc-300">{{student.age}}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <form class="mt-8 pt-6 border-t border-zinc-100 dark:border-zinc-800 grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Name</label>
      <input type="text" name="studentName" placeholder="Enter name" [(ngModel)]="name" 
        class="w-full px-3.5 py-2 text-sm border border-zinc-300 dark:border-zinc-700 rounded-lg bg-transparent text-zinc-900 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-colors">
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Age</label>
      <input type="number" name="studentAge" placeholder="Enter age" [(ngModel)]="age" 
        class="w-full px-3.5 py-2 text-sm border border-zinc-300 dark:border-zinc-700 rounded-lg bg-transparent text-zinc-900 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-colors">
    </div>
    <button (click)="addStudent()" 
      class="w-full px-4 py-2 text-sm font-semibold text-white bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 rounded-lg shadow-sm hover:shadow active:scale-[0.98] transition-all cursor-pointer">
      Add Student
    </button>
  </form>
</div>
