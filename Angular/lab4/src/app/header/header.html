<header class="sticky top-0 z-50 w-full backdrop-blur-md bg-white/80 dark:bg-zinc-950/80 border-b border-zinc-200/50 dark:border-zinc-800/50 transition-colors duration-300">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo / Branding -->
      <div class="flex items-center gap-2">
        <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-600 shadow-md shadow-violet-500/20 text-white font-extrabold text-lg">
          E
        </div>
        <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-zinc-900 to-zinc-700 dark:from-white dark:to-zinc-300 bg-clip-text text-transparent">
          EduPortal
        </span>
      </div>

      <!-- Navigation Links -->
      <nav class="flex items-center gap-1 sm:gap-2">
        <a routerLink="/home" 
           routerLinkActive="bg-violet-50 text-violet-600 dark:bg-violet-950/50 dark:text-violet-300 border-violet-200 dark:border-violet-800/50"
           [routerLinkActiveOptions]="{exact: true}"
           class="px-4 py-2 text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white rounded-xl border border-transparent transition-all duration-200 hover:bg-zinc-100/50 dark:hover:bg-zinc-800/40">
          Home
        </a>
        <a routerLink="/students" 
           routerLinkActive="bg-violet-50 text-violet-600 dark:bg-violet-950/50 dark:text-violet-300 border-violet-200 dark:border-violet-800/50"
           class="px-4 py-2 text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white rounded-xl border border-transparent transition-all duration-200 hover:bg-zinc-100/50 dark:hover:bg-zinc-800/40">
          Students
        </a>
        <a routerLink="/about" 
           routerLinkActive="bg-violet-50 text-violet-600 dark:bg-violet-950/50 dark:text-violet-300 border-violet-200 dark:border-violet-800/50"
           class="px-4 py-2 text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white rounded-xl border border-transparent transition-all duration-200 hover:bg-zinc-100/50 dark:hover:bg-zinc-800/40">
          About Us
        </a>
        <a routerLink="/contact" 
           routerLinkActive="bg-violet-50 text-violet-600 dark:bg-violet-950/50 dark:text-violet-300 border-violet-200 dark:border-violet-800/50"
           class="px-4 py-2 text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white rounded-xl border border-transparent transition-all duration-200 hover:bg-zinc-100/50 dark:hover:bg-zinc-800/40">
          Contact
        </a>
      </nav>
      
    </div>
  </div>
</header>
