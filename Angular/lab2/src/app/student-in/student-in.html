<form class="bg-zinc-50/50 dark:bg-zinc-800/20 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 grid grid-cols-1 sm:grid-cols-3 gap-4 items-end mb-6">
  <div class="flex flex-col gap-1.5">
    <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Name</label>
    <input type="text" name="studentName" placeholder="Enter name" [(ngModel)]="name" 
      class="w-full px-3.5 py-2 text-sm border border-zinc-300 dark:border-zinc-700 rounded-lg bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-colors">
  </div>
  <div class="flex flex-col gap-1.5">
    <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Age</label>
    <input type="number" name="studentAge" placeholder="Enter age" [(ngModel)]="age" 
      class="w-full px-3.5 py-2 text-sm border border-zinc-300 dark:border-zinc-700 rounded-lg bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-colors">
  </div>
  <button type="submit" (click)="addStudent(); $event.preventDefault()" 
    class="w-full px-4 py-2 text-sm font-semibold text-white bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 rounded-lg shadow-sm hover:shadow active:scale-[0.98] transition-all cursor-pointer">
    Add Student
  </button>
</form>
