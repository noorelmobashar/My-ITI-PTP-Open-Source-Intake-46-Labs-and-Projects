<div class="mt-6 p-5 bg-violet-50/50 dark:bg-violet-950/10 rounded-xl border border-violet-100 dark:border-violet-900/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
  <div class="flex flex-col gap-1">
    <div class="flex items-center gap-2">
      <span class="px-2 py-0.5 text-xs font-semibold text-violet-700 bg-violet-100 dark:text-violet-300 dark:bg-violet-900/50 rounded-full">ID: {{ student.id }}</span>
      <h3 class="text-base font-bold text-zinc-900 dark:text-white">{{ student.name }}</h3>
    </div>
    <p class="text-sm text-zinc-600 dark:text-zinc-400">Student is <span class="font-semibold text-violet-600 dark:text-violet-400">{{ student.age }}</span> years old.</p>
  </div>
  <button type="button" (click)="dismiss()" 
    class="px-4 py-2 text-sm font-semibold text-violet-700 hover:text-violet-800 dark:text-violet-300 dark:hover:text-violet-200 bg-white dark:bg-zinc-900 border border-violet-200 dark:border-violet-800 hover:bg-violet-50 dark:hover:bg-zinc-800 rounded-lg shadow-sm active:scale-[0.98] transition-all cursor-pointer">
    Close Details
  </button>
</div>
