<div class="max-w-4xl mx-auto my-8 p-6 bg-white dark:bg-zinc-900 rounded-2xl shadow-lg border border-zinc-100 dark:border-zinc-800">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-extrabold text-zinc-950 dark:text-white">Students Management</h2>
    <span class="px-3 py-1 text-xs font-semibold bg-violet-50 text-violet-700 dark:bg-violet-950 dark:text-violet-300 rounded-full border border-violet-100 dark:border-violet-850">
      Total Students: {{ students.length }}
    </span>
  </div>
  
  <!-- Add Student Form Component -->
  <app-student-in (studentAdded)="onStudentAdded($event)"></app-student-in>

  <!-- Students Table -->
  <div class="overflow-hidden border border-zinc-200 dark:border-zinc-800 rounded-xl">
    <table class="min-w-full divide-y divide-zinc-200 dark:divide-zinc-800">
      <thead class="bg-zinc-50 dark:bg-zinc-800/50">
        <tr>
          <th scope="col" class="px-6 py-3.5 text-left text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">ID</th>
          <th scope="col" class="px-6 py-3.5 text-left text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Name</th>
          <th scope="col" class="px-6 py-3.5 text-left text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Age</th>
          <th scope="col" class="px-6 py-3.5 text-right text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-zinc-200 dark:divide-zinc-800 bg-white dark:bg-zinc-900">
        <tr *ngFor="let student of students" class="hover:bg-zinc-50 dark:hover:bg-zinc-800/30 transition-colors">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-zinc-900 dark:text-white">{{ student.id }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-zinc-700 dark:text-zinc-300">{{ student.name }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-zinc-600 dark:text-zinc-400">{{ student.age }} years</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-right font-medium">
            <div class="flex justify-end gap-2">
              <button (click)="viewStudent(student)" 
                class="px-2.5 py-1 text-xs font-semibold text-violet-600 dark:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-950/50 rounded transition-colors cursor-pointer">
                View
              </button>
              <button (click)="editStudent(student)" 
                class="px-2.5 py-1 text-xs font-semibold text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-950/50 rounded transition-colors cursor-pointer">
                Edit
              </button>
              <button (click)="deleteStudent(student.id)" 
                class="px-2.5 py-1 text-xs font-semibold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/50 rounded transition-colors cursor-pointer">
                Delete
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="students.length === 0">
          <td colspan="4" class="px-6 py-10 text-center text-sm text-zinc-500 dark:text-zinc-400">
            No students found. Add one above!
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- View Component Portal -->
  <app-student-view *ngIf="selectedStudentForView" 
    [student]="selectedStudentForView" 
    (close)="selectedStudentForView = null">
  </app-student-view>

  <!-- Edit Component Portal -->
  <app-student-edit *ngIf="selectedStudentForEdit" 
    [student]="selectedStudentForEdit" 
    (studentUpdated)="onStudentUpdated($event)" 
    (close)="selectedStudentForEdit = null">
  </app-student-edit>
</div>
