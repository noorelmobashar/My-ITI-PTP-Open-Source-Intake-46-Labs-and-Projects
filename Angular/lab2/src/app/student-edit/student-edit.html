<div class="mt-6 p-5 bg-zinc-50 dark:bg-zinc-800/30 rounded-xl border border-zinc-200 dark:border-zinc-800">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-sm font-semibold text-zinc-900 dark:text-white">Edit Student Details</h3>
    <span class="text-xs text-zinc-500">ID: {{ student.id }}</span>
  </div>
  
  <form class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Name</label>
      <input type="text" name="editStudentName" [(ngModel)]="editName" 
        class="w-full px-3.5 py-2 text-sm border border-zinc-300 dark:border-zinc-700 rounded-lg bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-colors">
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Age</label>
      <input type="number" name="editStudentAge" [(ngModel)]="editAge" 
        class="w-full px-3.5 py-2 text-sm border border-zinc-300 dark:border-zinc-700 rounded-lg bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-colors">
    </div>
    <div class="flex gap-2">
      <button type="submit" (click)="save(); $event.preventDefault()" 
        class="flex-1 px-4 py-2 text-sm font-semibold text-white bg-amber-600 hover:bg-amber-500 rounded-lg shadow-sm hover:shadow active:scale-[0.98] transition-all cursor-pointer">
        Save
      </button>
      <button type="button" (click)="cancel()" 
        class="flex-1 px-4 py-2 text-sm font-semibold text-zinc-700 dark:text-zinc-300 bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 rounded-lg shadow-sm active:scale-[0.98] transition-all cursor-pointer">
        Cancel
      </button>
    </div>
  </form>
</div>
